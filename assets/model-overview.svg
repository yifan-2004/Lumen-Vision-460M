<rect x="65" y="255" width="200" height="122" rx="10" fill="#eaf2fa" stroke="#bacadd" stroke-width="1.5"/>
<text x="165.0" y="284" class="label" text-anchor="middle">Input image</text>
<text x="165.0" y="309" class="small" text-anchor="middle">Single image</text>
<text x="165.0" y="334" class="small" text-anchor="middle">EXIF-corrected RGB</text>
<rect x="310" y="255" width="200" height="122" rx="10" fill="#eaf2fa" stroke="#bacadd" stroke-width="1.5"/>
<text x="410.0" y="284" class="label" text-anchor="middle">Tiling / resize</text>
<text x="410.0" y="309" class="small" text-anchor="middle">512 × 512 per tile</text>
<text x="410.0" y="334" class="small" text-anchor="middle">Global + local views</text>
<rect x="555" y="255" width="200" height="122" rx="10" fill="#eaf2fa" stroke="#bacadd" stroke-width="1.5"/>
<text x="655.0" y="284" class="label" text-anchor="middle">SigLIP2 encoder</text>
<text x="655.0" y="309" class="small" text-anchor="middle">12 vision blocks</text>
<text x="655.0" y="334" class="small" text-anchor="middle">Patch 16 • hidden 768</text>
<rect x="800" y="255" width="200" height="122" rx="10" fill="#eeeafa" stroke="#bacadd" stroke-width="1.5"/>
<text x="900.0" y="284" class="label" text-anchor="middle">Pixel-shuffle + W</text>
<text x="900.0" y="309" class="small" text-anchor="middle">1024 → 64 tokens / tile</text>
<text x="900.0" y="334" class="small" text-anchor="middle">4 × 4 spatial reduction</text>
<rect x="1045" y="255" width="200" height="122" rx="10" fill="#eaf2fa" stroke="#bacadd" stroke-width="1.5"/>
<text x="1145.0" y="284" class="label" text-anchor="middle">Visual-text sequence</text>
<text x="1145.0" y="309" class="small" text-anchor="middle">Image token replacement</text>
<text x="1145.0" y="334" class="small" text-anchor="middle">Prompt embeddings</text>
<rect x="1290" y="255" width="200" height="122" rx="10" fill="#eaf2fa" stroke="#bacadd" stroke-width="1.5"/>
<text x="1390.0" y="284" class="label" text-anchor="middle">SmolLM2 decoder</text>
<text x="1390.0" y="309" class="small" text-anchor="middle">32 causal blocks</text>
<text x="1390.0" y="334" class="small" text-anchor="middle">Hidden 960 • 8K context</text>
<rect x="1535" y="255" width="200" height="122" rx="10" fill="#eaf2fa" stroke="#bacadd" stroke-width="1.5"/>
<text x="1635.0" y="284" class="label" text-anchor="middle">Generated answer</text>
<text x="1635.0" y="309" class="small" text-anchor="middle">Autoregressive decoding</text>
<text x="1635.0" y="334" class="small" text-anchor="middle">Text response</text>
<rect x="65" y="415" width="200" height="85" rx="10" fill="#eef5ed" stroke="#bacadd" stroke-width="1.5"/>
<text x="165.0" y="444" class="label" text-anchor="middle">User question</text>
<text x="165.0" y="469" class="small" text-anchor="middle">Tokenizer → embeddings</text>
<rect x="65" y="655" width="295" height="112" rx="10" fill="#f1f4f7" stroke="#bacadd" stroke-width="1.5"/>
<text x="212.5" y="684" class="label" text-anchor="middle">Train / held-out split</text>
<text x="212.5" y="709" class="small" text-anchor="middle">Distinct image paths + IDs</text>
<rect x="410" y="655" width="295" height="112" rx="10" fill="#f1f4f7" stroke="#bacadd" stroke-width="1.5"/>
<text x="557.5" y="684" class="label" text-anchor="middle">Frozen backbones</text>
<text x="557.5" y="709" class="small" text-anchor="middle">Vision encoder + decoder</text>
<rect x="755" y="655" width="295" height="112" rx="10" fill="#eeeafa" stroke="#bacadd" stroke-width="1.5"/>
<text x="902.5" y="684" class="label" text-anchor="middle">Train connector W</text>
<text x="902.5" y="709" class="small" text-anchor="middle">AdamW • answer-only loss</text>
<rect x="1100" y="655" width="295" height="112" rx="10" fill="#f1f4f7" stroke="#bacadd" stroke-width="1.5"/>
<text x="1247.5" y="684" class="label" text-anchor="middle">Validate + export</text>
<text x="1247.5" y="709" class="small" text-anchor="middle">Loss / token • safetensors</text>
<rect x="1445" y="655" width="295" height="112" rx="10" fill="#f1f4f7" stroke="#bacadd" stroke-width="1.5"/>
<text x="1592.5" y="684" class="label" text-anchor="middle">Load local connector</text>
<text x="1592.5" y="709" class="small" text-anchor="middle">Base + projector checkpoint</text>
<text x="555" y="410" class="small" text-anchor="start">64 tokens per tile; total depends on tiling.</text>
<text x="1290" y="410" class="small" text-anchor="start">15 attention / 5 KV heads</text>
<text x="65" y="808" class="small" text-anchor="start">Local preset: 512-pixel image limit • batch 1 • ≤1024 tokens • frozen vision and language weights</text>
<text x="55" y="883" class="foot" text-anchor="start">Architecture: unchanged base model. Training: freeze both backbones, adapt connector only; saved connector requires the base checkpoint.</text>
<text x="55" y="908" class="foot" text-anchor="start">Original diagram by Yifan Ouyang. Base architecture attribution and training scope: docs/TRAINING.md.</text>
