[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpsy-vllm-plugin"
version = "0.1.0"
description = "Out-of-tree vLLM plugin for VisionPsyNano"
requires-python = ">=3.10"
dependencies = [
    "einops",
]

# vLLM auto-loads this at startup (vllm serve / vllm.LLM), registering the
# VisionPsyForConditionalGeneration architecture. No manual register() needed.
[project.entry-points."vllm.general_plugins"]
register_visionpsy = "visionpsy_vllm:register"

[tool.setuptools]
packages = [
    "visionpsy_vllm",
    "visionpsy_vllm.reference",
    "visionpsy_vllm.reference.models",
    "visionpsy_vllm.reference.data",
]
